spring:
  application:
    name: carpentry-manager
  jackson:
    date-format: dd/MM/yyyy
    time-zone: UTC
  mongodb:
    uri: mongodb://localhost:27017/carpentry_manager_001000

server:
  port: 8080

app:
  ai:
    provider: gemini # gemini or claude
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.1-pro-preview
    url: https://generativelanguage.googleapis.com/v1beta/models/${app.gemini.model}:generateContent
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-opus-4-6
    url: https://api.anthropic.com/v1/messages
    version: 2023-06-01
  financial:
    vat-rate: 17.0
  storage:
    docs-path: D:\tmp\carpentry-manager-docs
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000 # 1 day in ms

logging:
  level:
    root: INFO
    com.carpentry.manager: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
